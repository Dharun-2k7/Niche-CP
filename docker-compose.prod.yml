version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: niche_cp_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-niche_cp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-niche_cp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
    networks:
      - nichecp_network

  redis:
    image: redis:7-alpine
    container_name: niche_cp_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - nichecp_network

  api:
    build:
      context: ./backend
    container_name: niche_cp_api_prod
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-niche_cp}?sslmode=disable
      BACKEND_URL: ${BACKEND_URL:-https://api.nichecp.app}
      FRONTEND_URL: ${FRONTEND_URL:-https://nichecp.app}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["/app/server"]
    networks:
      - nichecp_network

  worker:
    build:
      context: ./backend
    container_name: niche_cp_worker_prod
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-niche_cp}?sslmode=disable
      NICHECP_CACHE_DIR: /tmp/nichecp-cache-v3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/nichecp-cache-v3:/tmp/nichecp-cache-v3
      - /tmp/nichecp-go-cache-v3:/tmp/nichecp-go-cache-v3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["/app/worker"]
    networks:
      - nichecp_network

  frontend:
    build:
      context: ./frontend
    container_name: niche_cp_frontend_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - nichecp_network


volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data:

networks:
  nichecp_network:
