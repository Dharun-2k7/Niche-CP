<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .admin-table th, .admin-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }
        .admin-table th {
            color: var(--text-muted);
            font-size: 13px;
        }
        .admin-table td {
            font-size: 14px;
        }
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP <span style="color:var(--primary-accent); font-size:12px; margin-left:8px;">ADMIN</span></div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="admin.html" class="nav-link active">Admin</a>
            <a href="admin_problems.html" class="nav-link">Problems</a>
        </div>

        <div class="nav-controls">
            <div id="authNavContainer">
                <button class="btn-ghost" onclick="logout()" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="app-container repovive-layout" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div class="module-card">
            <h2>User Management</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Manage users and permissions</p>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Roll No</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="6" style="text-align:center;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Permissions Modal -->
    <div id="permissionsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="module-card" style="width: 400px; position: relative;">
            <button onclick="closePermissionsModal()" style="position:absolute; top:10px; right:10px; background:none; border:none; color:var(--text-muted); cursor:pointer;">✕</button>
            <h3>Edit Permissions</h3>
            <p id="permUserEmail" style="color:var(--text-muted); font-size:13px; margin-bottom: 15px;"></p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label><input type="checkbox" id="perm_create_problem" value="create_problem"> Create Problem</label>
                <label><input type="checkbox" id="perm_create_contest" value="create_contest"> Create Contest</label>
                <label><input type="checkbox" id="perm_manage_users" value="manage_users"> Manage Users</label>
                <label><input type="checkbox" id="perm_manage_admins" value="manage_admins"> Manage Admins</label>
            </div>
            <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="savePermissions()">Save Permissions</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('http://localhost:8080/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 403) {
                    document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:50px;">403 Forbidden - Admins Only</h1>';
                    return;
                }
                
                const users = await res.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                
                users.forEach(u => {
                    const status = u.is_college_verified ? '<span class="tag tag-primary">Verified</span>' : '<span class="tag">Pending</span>';
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td>${u.roll_no || '--'}</td>
                            <td>${status}</td>
                            <td>
                                <button class="btn-ghost" style="padding: 4px 8px; font-size: 12px;" onclick="openPermissionsModal('${u.email}')">Edit Role</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        });
        
        let currentEditEmail = '';

        function openPermissionsModal(email) {
            if (email === 'dharunkaarthick07@gmail.com') {
                alert('Cannot modify permissions of the super admin.');
                return;
            }
            currentEditEmail = email;
            document.getElementById('permUserEmail').innerText = email;
            // Reset checkboxes
            document.querySelectorAll('#permissionsModal input[type="checkbox"]').forEach(cb => cb.checked = false);
            // We don't have the user's current permissions in the API response yet, but the user requested an editor.
            // In a full implementation we would fetch them first.
            document.getElementById('permissionsModal').style.display = 'flex';
        }

        function closePermissionsModal() {
            document.getElementById('permissionsModal').style.display = 'none';
        }

        async function savePermissions() {
            const permissions = Array.from(document.querySelectorAll('#permissionsModal input[type="checkbox"]:checked')).map(cb => cb.value);
            try {
                const res = await fetch('http://localhost:8080/api/admin/users/permissions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ email: currentEditEmail, permissions })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Permissions updated successfully!');
                    closePermissionsModal();
                } else {
                    alert(data.error || 'Failed to update permissions');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred.');
            }
        }
    </script>
</body>
</html>
