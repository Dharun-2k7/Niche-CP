<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <!-- Floating Glass Navigation (Injected via JS) -->
    <div id="global-nav-container"></div>

    <main class="app-container repovive-layout" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 40px;">
            <div class="glass-card stat-card" style="text-align: center;">
                <h3 style="font-size: 32px; color: var(--primary-accent); margin-bottom: 8px;">24</h3>
                <p style="color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Total Users</p>
            </div>
            <div class="glass-card stat-card" style="text-align: center;">
                <h3 style="font-size: 32px; color: var(--primary-accent); margin-bottom: 8px;">156</h3>
                <p style="color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Problems</p>
            </div>
            <div class="glass-card stat-card" style="text-align: center;">
                <h3 style="font-size: 32px; color: var(--primary-accent); margin-bottom: 8px;">12</h3>
                <p style="color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Contests</p>
            </div>
            <div class="glass-card stat-card" style="text-align: center;">
                <h3 style="font-size: 32px; color: var(--primary-accent); margin-bottom: 8px;">8.4k</h3>
                <p style="color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Submissions</p>
            </div>
        </div>

        <div class="admin-grid">
            <aside>
                <div class="glass-card" style="position: sticky; top: 120px;">
                    <h3 style="margin-bottom: 20px; font-size: 18px;">Quick Actions</h3>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <a href="admin_problems.html" class="btn-magnetic" style="padding: 12px; text-align: center; text-decoration: none; border-radius: 8px; background: rgba(255,255,255,0.05); color: white; display: block; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;">Create Problem</a>
                        <a href="admin_contests.html" class="btn-magnetic" style="padding: 12px; text-align: center; text-decoration: none; border-radius: 8px; background: rgba(255,255,255,0.05); color: white; display: block; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s;">Create Contest</a>
                        <button onclick="document.querySelector('.admin-data-table').scrollIntoView({behavior: 'smooth'})" class="btn-ghost" style="width: 100%; padding: 12px;">Manage Users</button>
                    </div>
                </div>
            </aside>
            
            <div class="glass-card">
                <h2 style="margin-bottom: 8px;">User Management</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px;">Manage users and permissions</p>
                
                <div style="overflow-x: auto;">
                    <table class="admin-data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Roll No</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="6" style="text-align:center;">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Permissions Modal -->
    <div id="permissionsModal" class="premium-modal-overlay">
        <div class="premium-modal">
            <button onclick="closePermissionsModal()" style="position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); cursor:pointer; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background 0.2s;">✕</button>
            
            <h3 style="font-size: 20px; margin-bottom: 8px; font-weight: 600;">Edit Permissions</h3>
            <p id="permUserEmail" style="color:var(--text-muted); font-size:14px; margin-bottom: 24px;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <label class="custom-toggle">
                    <span style="font-size: 14px; font-weight: 500;">Create Problem</span>
                    <input type="checkbox" id="perm_create_problem" value="create_problem">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </label>
                <label class="custom-toggle">
                    <span style="font-size: 14px; font-weight: 500;">Create Contest</span>
                    <input type="checkbox" id="perm_create_contest" value="create_contest">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </label>
                <label class="custom-toggle">
                    <span style="font-size: 14px; font-weight: 500;">Manage Users</span>
                    <input type="checkbox" id="perm_manage_users" value="manage_users">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </label>
                <label class="custom-toggle">
                    <span style="font-size: 14px; font-weight: 500;">Manage Admins</span>
                    <input type="checkbox" id="perm_manage_admins" value="manage_admins">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </label>
            </div>
            
            <button class="btn-magnetic" style="width:100%; margin-top:32px; padding: 14px; font-size: 15px; border-radius: 12px; border: none; cursor: pointer;" onclick="savePermissions()">Save Permissions</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('http://localhost:8080/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 403) {
                    document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:50px;">403 Forbidden - Admins Only</h1>';
                    return;
                }
                
                const users = await res.json();
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';
                
                users.forEach(u => {
                    const status = u.is_college_verified ? '<span class="tag tag-primary">Verified</span>' : '<span class="tag">Pending</span>';
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td>${u.roll_no || '--'}</td>
                            <td>${status}</td>
                            <td>
                                <button class="btn-ghost" style="padding: 4px 8px; font-size: 12px;" onclick="openPermissionsModal('${u.email}')">Edit Role</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        });
        
        let currentEditEmail = '';

        function openPermissionsModal(email) {
            if (email === 'dharunkaarthick07@gmail.com') {
                alert('Cannot modify permissions of the super admin.');
                return;
            }
            currentEditEmail = email;
            document.getElementById('permUserEmail').innerText = email;
            // Reset checkboxes
            document.querySelectorAll('#permissionsModal input[type="checkbox"]').forEach(cb => cb.checked = false);
            // We don't have the user's current permissions in the API response yet, but the user requested an editor.
            // In a full implementation we would fetch them first.
            document.getElementById('permissionsModal').classList.add('active');
        }

        function closePermissionsModal() {
            document.getElementById('permissionsModal').classList.remove('active');
        }

        async function savePermissions() {
            const permissions = Array.from(document.querySelectorAll('#permissionsModal input[type="checkbox"]:checked')).map(cb => cb.value);
            try {
                const res = await fetch('http://localhost:8080/api/admin/users/permissions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ email: currentEditEmail, permissions })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Permissions updated successfully!');
                    closePermissionsModal();
                } else {
                    alert(data.error || 'Failed to update permissions');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred.');
            }
        }
    </script>
<script src="js/components.js"></script>
</body>
</html>
