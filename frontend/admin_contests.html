<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin - New Contest</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Floating Glass Navigation (Injected via JS) -->
    <div id="global-nav-container"></div>

    <main class="app-container repovive-layout fade-in-up" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div class="module-card glow-hover" style="border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(10, 10, 15, 0.5); backdrop-filter: blur(20px); border-radius: 16px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;" class="fade-in-up stagger-1">
                <div>
                    <h2 class="title-massive" style="font-size: 36px; background: linear-gradient(90deg, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Manage Contests</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin-top: 8px;">Create a new contest or edit an existing one with advanced configurations.</p>
                </div>
                <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <select id="contestSelect" class="cyber-select" style="max-width: 300px; padding: 10px 16px; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; cursor: pointer;">
                        <option value="new">✦ Create New Contest ✦</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group fade-in-up stagger-2" style="position: relative; margin-bottom: 24px;">
                <label style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-accent); margin-bottom: 8px; display: block;">Contest Title</label>
                <input type="text" id="cTitle" class="form-input" placeholder="e.g. NicheCP Starter Round 6" style="width: 100%; padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 16px; transition: border-color 0.3s, box-shadow 0.3s;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;" class="fade-in-up stagger-3">
                <div class="form-group">
                    <label style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; display: block;">Start Time</label>
                    <input type="datetime-local" id="cStartTime" class="form-input" style="width: 100%; padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px;">
                </div>
                <div class="form-group">
                    <label style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; display: block;">Duration (Minutes)</label>
                    <input type="number" id="cDuration" class="form-input" placeholder="120" style="width: 100%; padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px;">
                </div>
            </div>

            <div class="form-group fade-in-up stagger-4" style="margin-bottom: 32px;">
                <label style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; display: block;">Penalty Type</label>
                <select id="cType" class="cyber-select form-input" style="width: 100%; padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px;">
                    <option value="ICPC">ICPC (Time + 20m penalty)</option>
                    <option value="IOI">IOI (Partial Scoring)</option>
                    <option value="CUSTOM">Custom (Base Scoring)</option>
                </select>
            </div>

            <div class="fade-in-up stagger-5" style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                <p style="font-size: 13px; color: var(--text-muted); max-width: 400px; line-height: 1.5;">
                    <span style="color: var(--primary-accent); font-weight: 600;">Note:</span> After creating the contest, note the Contest ID and use the "Problems" tab to link existing or new problems to it.
                </p>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <span id="cMsg" style="font-size: 14px; display: none; font-weight: 500;"></span>
                    <button id="saveContestBtn" class="btn-magnetic" style="padding: 12px 32px; font-size: 15px; border-radius: 30px; display: flex; align-items: center; gap: 8px; border: none; cursor: pointer;">
                        <span>Create Contest</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'login.html';

        let currentContests = [];
        let selectedContestId = null;

        async function loadContests() {
            try {
                const res = await fetch('http://localhost:8080/api/contests');
                if (res.ok) {
                    currentContests = await res.json();
                    const select = document.getElementById('contestSelect');
                    if(currentContests && currentContests.length > 0) {
                        currentContests.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.id;
                            opt.textContent = `[ID: ${c.id}] ${c.title}`;
                            select.appendChild(opt);
                        });
                    }
                }
            } catch (e) {
                console.error("Failed to load contests", e);
            }
        }
        
        loadContests();

        document.getElementById('contestSelect').addEventListener('change', (e) => {
            const val = e.target.value;
            const btn = document.getElementById('saveContestBtn');
            const msg = document.getElementById('cMsg');
            msg.style.display = 'none';

            if (val === 'new') {
                selectedContestId = null;
                btn.textContent = 'Create Contest';
                document.querySelectorAll('.form-input').forEach(el => el.value = '');
            } else {
                selectedContestId = val;
                btn.textContent = 'Update Contest';
                const c = currentContests.find(x => x.id == val);
                if (c) {
                    document.getElementById('cTitle').value = c.title;
                    document.getElementById('cType').value = c.type;
                    document.getElementById('cDuration').value = c.duration_minutes;
                    
                    if (c.start_time) {
                        const dateObj = new Date(c.start_time);
                        const offset = dateObj.getTimezoneOffset() * 60000;
                        const localISOTime = (new Date(dateObj - offset)).toISOString().slice(0, 16);
                        document.getElementById('cStartTime').value = localISOTime;
                    }
                }
            }
        });

        document.getElementById('saveContestBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveContestBtn');
            const msg = document.getElementById('cMsg');
            
            const title = document.getElementById('cTitle').value;
            const startTimeStr = document.getElementById('cStartTime').value;
            const durationStr = document.getElementById('cDuration').value;
            const type = document.getElementById('cType').value;

            if(!title || !startTimeStr || !durationStr) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'All fields are required.';
                msg.style.display = 'inline-block';
                return;
            }

            const startTime = new Date(startTimeStr).toISOString();

            btn.textContent = selectedContestId ? 'Updating...' : 'Creating...';
            btn.disabled = true;

            const url = selectedContestId 
                ? `http://localhost:8080/api/admin/contests/${selectedContestId}`
                : `http://localhost:8080/api/admin/contests`;
            
            const method = selectedContestId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        type: type,
                        start_time: startTime,
                        duration_minutes: parseInt(durationStr)
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#10b981';
                    msg.textContent = selectedContestId ? data.message : `${data.message} (Contest ID: ${data.contest_id})`;
                    msg.style.display = 'inline-block';
                    
                    if (!selectedContestId) {
                        document.querySelectorAll('.form-input').forEach(el => el.value = '');
                        document.getElementById('contestSelect').innerHTML = '<option value="new">-- Create New Contest --</option>';
                        loadContests();
                    }
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = data.error;
                    msg.style.display = 'inline-block';
                }
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Network error';
                msg.style.display = 'inline-block';
            } finally {
                btn.textContent = selectedContestId ? 'Update Contest' : 'Create Contest';
                btn.disabled = false;
            }
        });
    </script>
<script src="js/components.js"></script>
</body>
</html>
