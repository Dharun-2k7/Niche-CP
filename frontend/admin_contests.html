<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin - New Contest</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP <span style="color:var(--primary-accent); font-size:12px; margin-left:8px;">ADMIN</span></div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="admin.html" class="nav-link">Admin</a>
            <a href="admin_problems.html" class="nav-link">Problems</a>
            <a href="admin_contests.html" class="nav-link active">Contests</a>
        </div>

        <div class="nav-controls">
            <div id="authNavContainer"></div>
        </div>
    </nav>

    <main class="app-container repovive-layout" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div class="module-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;">
                <div>
                    <h2>Manage Contests</h2>
                    <p style="color: var(--text-muted); margin-bottom: 0;">Create a new contest or edit an existing one</p>
                </div>
                <select id="contestSelect" class="cyber-select" style="max-width: 300px; padding: 8px;">
                    <option value="new">-- Create New Contest --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Contest Title</label>
                <input type="text" id="cTitle" class="form-input" placeholder="e.g. NicheCP Starter Round 6">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="datetime-local" id="cStartTime" class="form-input">
                </div>
                <div class="form-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" id="cDuration" class="form-input" placeholder="120">
                </div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Penalty Type</label>
                <select id="cType" class="cyber-select form-input">
                    <option value="ICPC">ICPC (Time + 20m penalty)</option>
                    <option value="IOI">IOI (Partial Scoring)</option>
                    <option value="CUSTOM">Custom (Base Scoring)</option>
                </select>
            </div>

            <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px;">
                <button id="saveContestBtn" class="btn-primary" style="padding: 10px 24px; font-size: 14px; border-radius: 6px;">Create Contest</button>
                <span id="cMsg" style="font-size: 13px; display: none;"></span>
            </div>
            
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 16px;">
                After creating the contest, note the Contest ID and use the "Problems" tab to link existing or new problems to it.
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'login.html';

        let currentContests = [];
        let selectedContestId = null;

        async function loadContests() {
            try {
                const res = await fetch('http://localhost:8080/api/contests');
                if (res.ok) {
                    currentContests = await res.json();
                    const select = document.getElementById('contestSelect');
                    if(currentContests && currentContests.length > 0) {
                        currentContests.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.id;
                            opt.textContent = `[ID: ${c.id}] ${c.title}`;
                            select.appendChild(opt);
                        });
                    }
                }
            } catch (e) {
                console.error("Failed to load contests", e);
            }
        }
        
        loadContests();

        document.getElementById('contestSelect').addEventListener('change', (e) => {
            const val = e.target.value;
            const btn = document.getElementById('saveContestBtn');
            const msg = document.getElementById('cMsg');
            msg.style.display = 'none';

            if (val === 'new') {
                selectedContestId = null;
                btn.textContent = 'Create Contest';
                document.querySelectorAll('.form-input').forEach(el => el.value = '');
            } else {
                selectedContestId = val;
                btn.textContent = 'Update Contest';
                const c = currentContests.find(x => x.id == val);
                if (c) {
                    document.getElementById('cTitle').value = c.title;
                    document.getElementById('cType').value = c.type;
                    document.getElementById('cDuration').value = c.duration_minutes;
                    
                    if (c.start_time) {
                        const dateObj = new Date(c.start_time);
                        const offset = dateObj.getTimezoneOffset() * 60000;
                        const localISOTime = (new Date(dateObj - offset)).toISOString().slice(0, 16);
                        document.getElementById('cStartTime').value = localISOTime;
                    }
                }
            }
        });

        document.getElementById('saveContestBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveContestBtn');
            const msg = document.getElementById('cMsg');
            
            const title = document.getElementById('cTitle').value;
            const startTimeStr = document.getElementById('cStartTime').value;
            const durationStr = document.getElementById('cDuration').value;
            const type = document.getElementById('cType').value;

            if(!title || !startTimeStr || !durationStr) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'All fields are required.';
                msg.style.display = 'inline-block';
                return;
            }

            const startTime = new Date(startTimeStr).toISOString();

            btn.textContent = selectedContestId ? 'Updating...' : 'Creating...';
            btn.disabled = true;

            const url = selectedContestId 
                ? `http://localhost:8080/api/admin/contests/${selectedContestId}`
                : `http://localhost:8080/api/admin/contests`;
            
            const method = selectedContestId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        type: type,
                        start_time: startTime,
                        duration_minutes: parseInt(durationStr)
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#10b981';
                    msg.textContent = selectedContestId ? data.message : `${data.message} (Contest ID: ${data.contest_id})`;
                    msg.style.display = 'inline-block';
                    
                    if (!selectedContestId) {
                        document.querySelectorAll('.form-input').forEach(el => el.value = '');
                        document.getElementById('contestSelect').innerHTML = '<option value="new">-- Create New Contest --</option>';
                        loadContests();
                    }
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = data.error;
                    msg.style.display = 'inline-block';
                }
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Network error';
                msg.style.display = 'inline-block';
            } finally {
                btn.textContent = selectedContestId ? 'Update Contest' : 'Create Contest';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
