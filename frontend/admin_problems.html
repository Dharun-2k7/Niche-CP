<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin - New Problem</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP <span style="color:var(--primary-accent); font-size:12px; margin-left:8px;">ADMIN</span></div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="admin.html" class="nav-link">Admin</a>
            <a href="admin_problems.html" class="nav-link active">Problems</a>
        </div>

        <div class="nav-controls">
            <div id="authNavContainer">
                <button class="btn-ghost" onclick="logout()" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="app-container repovive-layout" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div class="module-card">
            <h2>Create New Problem</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Add a new problem to the independent Problem Bank</p>
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>Problem Title</label>
                    <input type="text" id="pTitle" class="form-input" placeholder="e.g. Graph BFS Traversal">
                </div>
                <div class="form-group">
                    <label>Difficulty</label>
                    <select id="pDifficulty" class="cyber-select form-input">
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Tags (Comma separated)</label>
                <input type="text" id="pTags" class="form-input" placeholder="e.g. graph, bfs, short-path">
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Problem Statement (Markdown/HTML)</label>
                <textarea id="pDesc" class="form-input" style="height: 100px; resize: vertical;" placeholder="<p>Given an undirected graph...</p>"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
                <div class="form-group">
                    <label>Input Format</label>
                    <textarea id="pInputFormat" class="form-input" style="height: 80px;" placeholder="First line N M..."></textarea>
                </div>
                <div class="form-group">
                    <label>Output Format</label>
                    <textarea id="pOutputFormat" class="form-input" style="height: 80px;" placeholder="Print space-separated..."></textarea>
                </div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Constraints</label>
                <textarea id="pConstraints" class="form-input" style="height: 60px;" placeholder="1 <= N <= 10^5"></textarea>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Sample Test Cases (JSON Array)</label>
                <textarea id="pSampleTestCases" class="form-input" style="height: 100px; font-family: monospace; resize: vertical;" placeholder='[{"input": "...", "expected_output": "..."}]'></textarea>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Hidden Test Cases (JSON Array) <span style="color:red">*</span></label>
                <textarea id="pHiddenTestCases" class="form-input" style="height: 150px; font-family: monospace; resize: vertical;" placeholder='[{"input": "...", "expected_output": "..."}]'></textarea>
                <p style="font-size:12px; color:var(--text-muted); margin-top: 4px;">Must be a valid JSON array of objects with `input` and `expected_output`.</p>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Problem Destination</label>
                <select id="pDestination" class="cyber-select form-input">
                    <option value="practice">Practice Problem (Independent)</option>
                    <option value="contest">Link to Specific Contest (Enter ID below)</option>
                </select>
            </div>

            <div class="form-group" id="contestIdGroup" style="margin-top: 16px; display:none;">
                <label>Contest ID</label>
                <input type="number" id="pContestId" class="form-input" placeholder="e.g. 5">
            </div>

            <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px;">
                <button id="createProblemBtn" class="btn-primary" style="padding: 10px 24px; font-size: 14px; border-radius: 6px;">Publish Problem</button>
                <span id="pMsg" style="font-size: 13px; display: none;"></span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'login.html';

        document.getElementById('pDestination').addEventListener('change', (e) => {
            document.getElementById('contestIdGroup').style.display = e.target.value === 'contest' ? 'block' : 'none';
        });

        document.getElementById('createProblemBtn').addEventListener('click', async () => {
            const btn = document.getElementById('createProblemBtn');
            const msg = document.getElementById('pMsg');
            
            const title = document.getElementById('pTitle').value;
            const difficulty = document.getElementById('pDifficulty').value;
            const tagsRaw = document.getElementById('pTags').value;
            const desc = document.getElementById('pDesc').value;
            const inputFormat = document.getElementById('pInputFormat').value;
            const outputFormat = document.getElementById('pOutputFormat').value;
            const constraints = document.getElementById('pConstraints').value;
            let sampleCases = document.getElementById('pSampleTestCases').value;
            let hiddenCases = document.getElementById('pHiddenTestCases').value;
            const dest = document.getElementById('pDestination').value;
            const contestIdStr = document.getElementById('pContestId').value;

            if(!title || !desc || !hiddenCases) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Title, Description, and Hidden Testcases are required fields.';
                msg.style.display = 'inline-block';
                return;
            }

            try {
                if(sampleCases) JSON.parse(sampleCases);
                JSON.parse(hiddenCases);
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Invalid JSON in test cases';
                msg.style.display = 'inline-block';
                return;
            }

            const tagsArr = tagsRaw ? tagsRaw.split(',').map(t => t.trim()) : [];
            let contestId = null;
            if (dest === 'contest' && contestIdStr) {
                contestId = parseInt(contestIdStr);
            }

            btn.textContent = 'Publishing...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8080/api/admin/problems', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        difficulty: difficulty,
                        tags: JSON.stringify(tagsArr),
                        description: desc,
                        input_format: inputFormat,
                        output_format: outputFormat,
                        constraints: constraints,
                        sample_testcases: sampleCases || '[]',
                        hidden_testcases: hiddenCases,
                        contest_id: contestId
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#10b981';
                    msg.textContent = data.message;
                    msg.style.display = 'inline-block';
                    
                    document.querySelectorAll('.form-input').forEach(el => el.value = '');
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = data.error;
                    msg.style.display = 'inline-block';
                }
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Network error';
                msg.style.display = 'inline-block';
            } finally {
                btn.textContent = 'Publish Problem';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
