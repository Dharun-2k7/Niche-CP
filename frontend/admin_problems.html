<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Admin - New Problem</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP <span style="color:var(--primary-accent); font-size:12px; margin-left:8px;">ADMIN</span></div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="admin.html" class="nav-link">Admin</a>
            <a href="admin_problems.html" class="nav-link active">Problems</a>
        </div>

        <div class="nav-controls">
            <div id="authNavContainer">
                <button class="btn-ghost" onclick="logout()" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="app-container repovive-layout" style="margin-top: 40px; grid-template-columns: 1fr;">
        <div class="module-card">
            <h2>Create New Problem</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Upload a new problem to the contest engine</p>
            
            <div class="form-group">
                <label>Problem Title</label>
                <input type="text" id="pTitle" class="form-input" placeholder="e.g. Graph BFS Traversal">
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Problem Statement (Markdown/HTML)</label>
                <textarea id="pDesc" class="form-input" style="height: 150px; resize: vertical;" placeholder="<p>Given an undirected graph...</p>"></textarea>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Hidden Test Cases (JSON Array)</label>
                <textarea id="pTestCases" class="form-input" style="height: 150px; font-family: monospace; resize: vertical;" placeholder='[&#10;  {&#10;    "input": "3 2\n1 2\n2 3",&#10;    "expected_output": "1 2 3"&#10;  }&#10;]'></textarea>
                <p style="font-size:12px; color:var(--text-muted); margin-top: 4px;">Must be a valid JSON array of objects with `input` and `expected_output`.</p>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label>Contest ID (Optional)</label>
                <input type="number" id="pContestId" class="form-input" placeholder="Leave blank if practice problem">
            </div>

            <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px;">
                <button id="createProblemBtn" class="btn-primary" style="padding: 10px 24px; font-size: 14px; border-radius: 6px;">Publish Problem</button>
                <span id="pMsg" style="font-size: 13px; display: none;"></span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'login.html';

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = 'index.html';
        }

        document.getElementById('createProblemBtn').addEventListener('click', async () => {
            const btn = document.getElementById('createProblemBtn');
            const msg = document.getElementById('pMsg');
            const title = document.getElementById('pTitle').value;
            const desc = document.getElementById('pDesc').value;
            let testCases = document.getElementById('pTestCases').value;
            const contestIdStr = document.getElementById('pContestId').value;

            if(!title || !desc || !testCases) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Please fill all required fields';
                msg.style.display = 'inline-block';
                return;
            }

            // Validate JSON
            try {
                JSON.parse(testCases);
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Invalid JSON in test cases';
                msg.style.display = 'inline-block';
                return;
            }

            let contestId = null;
            if(contestIdStr) contestId = parseInt(contestIdStr);

            btn.textContent = 'Publishing...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:8080/api/admin/problems', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        description: desc,
                        test_cases: testCases,
                        contest_id: contestId
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    msg.style.color = '#10b981';
                    msg.textContent = data.message;
                    msg.style.display = 'inline-block';
                    
                    document.getElementById('pTitle').value = '';
                    document.getElementById('pDesc').value = '';
                    document.getElementById('pTestCases').value = '';
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = data.error;
                    msg.style.display = 'inline-block';
                }
            } catch(e) {
                msg.style.color = '#ff4d4d';
                msg.textContent = 'Network error';
                msg.style.display = 'inline-block';
            } finally {
                btn.textContent = 'Publish Problem';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
