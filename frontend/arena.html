<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niche CP - Reverse & Golf</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP</div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="contests.html" class="nav-link">Contests</a>
            <a href="index.html#problems" class="nav-link">Problems</a>
            <a href="arena.html" class="nav-link active">Arena</a>
            <a href="index.html#resources" class="nav-link">Resources</a>
        </div>

        <div class="nav-controls">
            <div id="authNavContainer">
                <a href="login.html" class="btn-magnetic" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign In</a>
            </div>
        </div>
    </nav>
    <main class="app-container">
        <h1 class="display-font" style="font-size: 32px; font-weight: 700; margin-bottom: 32px;">Arena: The Hidden Sequence</h1>

        <section class="problem-arena">
            <div class="problem-statement glass-panel">
                <h2>Problem: The Hidden Sequence</h2>
                <div class="test-cases">
                    <div class="case">
                        <span class="label">Input:</span> <span class="code-val">5</span>
                        <br>
                        <span class="label">Output:</span> <span class="code-val">120</span>
                    </div>
                    <div class="case">
                        <span class="label">Input:</span> <span class="code-val">3</span>
                        <br>
                        <span class="label">Output:</span> <span class="code-val">6</span>
                    </div>
                </div>
                <p class="hint">Hint: Math is your friend.</p>
            </div>

            <div class="editor-section glass-panel">
                <div class="editor-header">
                    <select id="language" class="cyber-select">
                        <option value="python">Python 3</option>
                        <option value="cpp">C++</option>
                        <option value="go">Go</option>
                    </select>
                    <div class="action-buttons" style="display: flex; align-items: center; gap: 10px;">
                        <span style="color: #ff4d4d; font-size: 0.8rem; text-align: right; max-width: 200px;">Check your code before submitting (5s cooldown)</span>
                        <button id="runBtn" class="cyber-btn btn-secondary">Run Code</button>
                        <button id="submitBtn" class="cyber-btn">Submit Code</button>
                    </div>
                </div>
                <div id="codeEditorContainer" style="height: 400px; width: 100%; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 20px;"></div>
                
                <div class="custom-input-section">
                    <h3>Custom Input</h3>
                    <textarea id="customInput" spellcheck="false" placeholder="Enter input values here..."></textarea>
                    
                    <h3>Terminal Output</h3>
                    <textarea id="terminalOutput" readonly placeholder="Output will appear here..."></textarea>
                </div>

                <div id="statusMessage" class="status-banner"></div>
            </div>
        </section>
    </main>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
