<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Arena Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .problem-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .problem-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .problem-row:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .diff-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .diff-easy { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .diff-medium { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .diff-hard { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Floating Glass Navigation (Injected via JS) -->
    <div id="global-nav-container"></div>

    <main class="app-container" style="max-width: 1000px; padding: 40px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div>
                <h1 class="display-font" style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">The Arena</h1>
                <p style="color: var(--text-muted); font-size: 15px;">Discover practice problems from the independent Problem Bank.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <input type="text" class="cyber-select" placeholder="Search Tags..." style="padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; border-radius: 6px;">
                <select class="cyber-select" style="padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; border-radius: 6px;">
                    <option>All Difficulties</option>
                    <option>Easy</option>
                    <option>Medium</option>
                    <option>Hard</option>
                </select>
            </div>
        </div>

        <div class="problem-grid" id="problemList">
            <div style="text-align:center; color: var(--text-muted); margin-top: 40px;">Fetching problems...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('http://localhost:8080/api/problems');
                if (!res.ok) throw new Error('Failed to fetch');
                const problems = await res.json();
                
                const list = document.getElementById('problemList');
                list.innerHTML = '';
                
                let solvedProblems = new Set();
                const token = localStorage.getItem('jwt_token');
                if (token) {
                    try {
                        const solvedRes = await fetch('http://localhost:8080/api/profile/solved', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (solvedRes.ok) {
                            const solvedData = await solvedRes.json();
                            if (solvedData.solved_problems) {
                                solvedData.solved_problems.forEach(id => solvedProblems.add(id));
                            }
                        }
                    } catch(e){}
                }
                
                if (problems.length === 0) {
                    list.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 40px;">No problems available.</div>';
                    return;
                }

                problems.forEach(p => {
                    const diffClass = p.difficulty ? `diff-${p.difficulty.toLowerCase()}` : 'diff-medium';
                    const diffText = p.difficulty || 'Medium';
                    
                    let tagsHtml = '';
                    try {
                        const tags = JSON.parse(p.tags);
                        if (tags && tags.length > 0) {
                            tagsHtml = tags.map(t => `<span style="font-size:12px; color:var(--text-muted); background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:4px; margin-right:6px;">${t}</span>`).join('');
                        }
                    } catch(e){}

                    let solveStatusHtml = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10.08 10.08 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        Solve
                    `;
                    if (solvedProblems.has(p.id)) {
                        solveStatusHtml = `
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M22 11.08V12a10.08 10.08 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span style="color: #10b981; font-weight: 600;">Solved</span>
                        `;
                    }

                    list.innerHTML += `
                        <a href="problem.html?problem_id=${p.id}" class="problem-row">
                            <div style="display:flex; align-items:center; gap:24px;">
                                <div style="font-family:monospace; color:var(--text-muted); font-size:14px; width:60px;">NCP-${p.id}</div>
                                <div>
                                    <div style="font-size:16px; font-weight:600; margin-bottom:6px;">${p.title}</div>
                                    <div style="display:flex; align-items:center;">
                                        ${tagsHtml}
                                    </div>
                                </div>
                            </div>
                            <div style="display:flex; align-items:center; gap:24px;">
                                <div class="diff-tag ${diffClass}">${diffText}</div>
                                <div style="color:var(--text-muted); font-size:13px; display:flex; align-items:center; gap:4px;">
                                    ${solveStatusHtml}
                                </div>
                            </div>
                        </a>
                    `;
                });
            } catch(e) {
                document.getElementById('problemList').innerHTML = '<div style="text-align:center; color: #ff4d4d; margin-top: 40px;">Failed to load problems from backend.</div>';
            }
        });
    </script>
<script src="js/components.js"></script>
</body>
</html>
