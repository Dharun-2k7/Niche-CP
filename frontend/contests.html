<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Contests</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0d0d0f; } /* Darker background for contests list */
    </style>
</head>
<body data-theme="quantum">

    <!-- Navbar -->
    <!-- Floating Glass Navigation (Injected via JS) -->
    <div id="global-nav-container"></div>

    <main class="app-container" style="max-width: 1000px; padding-top: 20px;">
        <div id="contestsContainer">
            <div style="display:flex; flex-direction:column; gap:16px; margin-top:40px;">
                <div class="skeleton" style="height: 80px; width: 100%;"></div>
                <div class="skeleton" style="height: 80px; width: 100%;"></div>
                <div class="skeleton" style="height: 80px; width: 100%;"></div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('contestsContainer');
            
            try {
                const response = await fetch('http://localhost:8080/api/contests');
                if (!response.ok) throw new Error('Failed to fetch contests');
                const data = await response.json();
                
                const now = new Date();
                
                const upcoming = [];
                const past = [];
                
                // If it's returning a map/array wrapper
                const contestList = data.contests || data || [];

                contestList.forEach(c => {
                    // strict UTC parsing
                    const startTime = new Date(c.start_time);
                    if (startTime > now) {
                        upcoming.push(c);
                    } else {
                        past.push(c);
                    }
                });

                let html = '';

                // UPCOMING SECTION
                if (upcoming.length > 0) {
                    html += `
                        <div class="contest-list-header">
                            <div>UPCOMING</div>
                            <div>LENGTH</div>
                            <div></div>
                        </div>
                    `;
                    upcoming.forEach(c => {
                        const startTime = new Date(c.start_time);
                        const dateStr = startTime.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
                        const h = Math.floor(c.duration_minutes / 60);
                        const m = (c.duration_minutes % 60).toString().padStart(2, '0');
                        
                        html += `
                            <div class="contest-row">
                                <div>
                                    <div class="contest-title">${c.title}</div>
                                    <div class="contest-meta">${dateStr}</div>
                                </div>
                                <div class="contest-meta">${h}:${m}</div>
                                <div class="contest-actions">
                                    <div class="contest-countdown">06:08:44:02</div>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                    <a href="contest_arena.html?id=${c.id}" class="btn-enter">Enter</a>
                                </div>
                            </div>
                        `;
                    });
                }

                // PREVIOUS SECTION
                if (past.length > 0) {
                    html += `
                        <div class="contest-list-header" style="margin-top: 60px;">
                            <div>PREVIOUS</div>
                            <div>LENGTH</div>
                            <div></div>
                        </div>
                    `;
                    past.forEach(c => {
                        const startTime = new Date(c.start_time);
                        const dateStr = startTime.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
                        const h = Math.floor(c.duration_minutes / 60);
                        const m = (c.duration_minutes % 60).toString().padStart(2, '0');
                        
                        html += `
                            <div class="contest-row">
                                <div>
                                    <div class="contest-title">${c.title}</div>
                                    <div class="contest-meta">${dateStr}</div>
                                </div>
                                <div class="contest-meta">${h}:${m}</div>
                                <div class="contest-actions">
                                    <a href="coming-soon.html" class="contest-action-link">Ranking</a>
                                    <a href="coming-soon.html" class="contest-action-link">Virtual</a>
                                </div>
                            </div>
                        `;
                    });
                }

                if (upcoming.length === 0 && past.length === 0) {
                    html = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">No contests found.</div>`;
                }

                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Error loading contests. Is the backend running?</div>`;
            }
        });
    </script>
<script src="js/components.js"></script>
</body>
</html>
