<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | Contests</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .ranking-card {
            background: rgba(20, 20, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .ranking-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            font-weight: 600;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }
        .ranking-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ranking-table td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .ranking-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP</div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="contests.html" class="nav-link active">Contests</a>
            <a href="index.html#problems" class="nav-link">Problems</a>
            <a href="arena.html" class="nav-link">Arena</a>
            <a href="index.html#resources" class="nav-link">Resources</a>
        </div>

        <div class="nav-controls">
            <div class="theme-switcher">
                <div class="theme-dot active" data-set="quantum" style="cursor: pointer;"></div>
                <div class="theme-dot" data-set="aurora" style="cursor: pointer;"></div>
                <div class="theme-dot" data-set="solar" style="cursor: pointer;"></div>
            </div>
            <div id="authNavContainer">
                <a href="login.html" class="btn-magnetic" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign In</a>
            </div>
        </div>
    </nav>

    <main class="app-container" style="max-width: 1000px; padding: 40px 20px;">
        <h1 class="display-font" style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Contests</h1>

        <div id="contestsContainer">
            <div style="text-align:center; color: var(--text-muted); margin-top: 40px;">Fetching contests...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('http://localhost:8080/api/contests');
                if (!res.ok) throw new Error('Fetch failed');
                const contests = await res.json();
                
                const container = document.getElementById('contestsContainer');
                container.innerHTML = '';
                
                if (!contests || contests.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 40px;">No contests scheduled.</div>';
                    return;
                }

                const now = new Date();
                const upcoming = [], live = [], past = [];

                contests.forEach(c => {
                    const start = new Date(c.start_time);
                    const end = new Date(start.getTime() + c.duration_minutes * 60000);
                    
                    if (now < start) upcoming.push({...c, start, end});
                    else if (now >= start && now < end) live.push({...c, start, end});
                    else past.push({...c, start, end});
                });

                const renderRow = (c, state) => {
                    let actionBtn = '';
                    let timeText = '';
                    
                    if (state === 'live') {
                        actionBtn = `<a href="contest_arena.html?id=${c.id}" class="btn-enter" style="text-decoration:none; padding:8px 16px;">Enter</a>`;
                        timeText = `<div style="color:#10b981; font-weight:600;">LIVE NOW</div>`;
                    } else if (state === 'upcoming') {
                        actionBtn = `<button disabled style="opacity:0.5; padding:8px 16px;">Starts Soon</button>`;
                        timeText = `<div>${c.start.toLocaleString()}</div>`;
                    } else {
                        actionBtn = `<button class="btn-ghost" style="padding:8px 16px;">Virtual</button>`;
                        timeText = `<div>Ended</div>`;
                    }

                    return `
                        <div class="repovive-contest-row">
                            <div>
                                <div class="title">${c.title}</div>
                                <div class="meta">${c.type} format &bull; ${c.duration_minutes} mins</div>
                            </div>
                            <div class="length">${timeText}</div>
                            <div class="actions">
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                };

                let html = '';
                if (live.length > 0) {
                    html += `<div class="repovive-contests-header" style="color:#10b981; border-bottom-color:#10b981;"><h2>Live Now</h2></div>`;
                    html += live.map(c => renderRow(c, 'live')).join('');
                }
                if (upcoming.length > 0) {
                    html += `<div class="repovive-contests-header" style="margin-top: 40px;"><h2>Upcoming</h2></div>`;
                    html += upcoming.map(c => renderRow(c, 'upcoming')).join('');
                }
                if (past.length > 0) {
                    html += `<div class="repovive-contests-header" style="margin-top: 40px;"><h2>Past Contests</h2></div>`;
                    html += past.map(c => renderRow(c, 'past')).join('');
                }

                container.innerHTML = html;
            } catch(e) {
                document.getElementById('contestsContainer').innerHTML = '<div style="text-align:center; color: #ff4d4d; margin-top: 40px;">Failed to load contests from backend.</div>';
            }
        });
    </script>
</body>
</html>
