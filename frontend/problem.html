<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niche CP - Reverse & Golf</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body data-theme="quantum">
    <!-- Unified Navigation -->
    <!-- Floating Glass Navigation (Injected via JS) -->
    <div id="global-nav-container"></div>
    <!-- 
        NOTE FOR BACKEND INTEGRATION:
        The content below (Subheader, Problem Statement, Constraints, etc.) 
        should be dynamically fetched and rendered by JavaScript 
        based on the problem ID in the URL (e.g., ?problem_id=1). 
    -->
    <div class="niche-arena-subheader">
        <div class="left">
            <span class="id" id="problemIdDisplay">Loading...</span>
            <span class="title" id="problemTitleDisplay">Please wait</span>
            <span class="diff" id="problemDiffDisplay">--</span>
            <span id="problemSolvedDisplay" style="margin-left: 12px; display: none; align-items: center; gap: 4px; color: #10b981; font-weight: 600; font-size: 14px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M22 11.08V12a10.08 10.08 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Solved
            </span>
        </div>
        <div class="right">
            <span id="problemRoundDisplay">Practice Mode</span>
        </div>
    </div>

    <main class="niche-arena-layout">
        <div class="niche-arena-left" id="arenaLeft">
            <div class="niche-arena-tabs">
                <div class="tab active">Statement</div>
            </div>
            <div class="niche-arena-content" id="problemContentDisplay">
                <p>Loading problem description...</p>
            </div>
        </div>
        
        <div class="drag-divider" id="dragDivider"></div>
        
        <div class="niche-arena-right" id="arenaRight" style="position: relative; display: flex; flex-direction: column;">
            <div class="editor-top" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 16px; background: var(--card-bg);">
                <div style="display: flex; gap: 16px; align-items: center;">
                    <select id="language" class="cyber-select" style="padding: 4px 12px; font-size: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: white;">
                        <option value="cpp">C++ 23</option>
                        <option value="python">Python 3</option>
                        <option value="go">Go</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button id="runBtn" class="btn-ghost" style="padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; border:none; color: var(--text-muted);">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Run
                    </button>
                    <button id="submitBtn" style="padding: 6px 16px; font-size: 13px; background: transparent; color: #10b981; border: none; display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        Submit
                    </button>
                    <!-- Tools icons -->
                    <div style="display: flex; gap: 12px; color: var(--text-muted); margin-left: 8px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                </div>
            </div>
            
            <div class="editor-container" id="codeEditorContainer" style="flex: 1;"></div>
            
            <div class="terminal-pane" style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.05); background: var(--card-bg); height: 280px;">
                <div style="display: flex; gap: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 16px;">
                    <div class="tc-tab active" data-target="pane-testcases" style="padding: 12px 0; color: #10b981; font-weight: 600; cursor: pointer; border-bottom: 2px solid #10b981; display: flex; align-items: center; gap: 8px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Testcase
                    </div>
                    <div class="tc-tab" data-target="pane-results" style="padding: 12px 0; color: var(--text-muted); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid transparent;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        Test Result
                    </div>
                </div>
                
                <div style="padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
                    <div id="pane-testcases" class="tc-pane" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
                        <textarea id="customInput" style="width:100%; flex: 1; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:#e0e0e0; padding:12px; font-family:monospace; resize:none;" placeholder="Enter custom input here..."></textarea>
                    </div>
                    
                    <div id="pane-results" class="tc-pane" style="display: none; flex-direction: column; gap: 12px; flex: 1;">
                        <textarea id="terminalOutput" style="width:100%; flex:1; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:#e0e0e0; padding:12px; font-family:monospace; resize:none; font-size: 13px;" readonly></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Floating Verdict Panel Overlay -->
            <div id="verdictPanel" style="display: none; position: absolute; bottom: 20px; right: 20px; width: 320px; background: #0f1115; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                <button onclick="document.getElementById('verdictPanel').style.display='none'" style="position:absolute; top:12px; right:12px; background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div style="font-family: monospace; font-size: 20px; font-weight: 800; color: white; margin-bottom: 16px;">
                    <span style="color: #10b981;">[</span>R<span style="color: #10b981;">]</span>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
                    <div id="verdictIcon"></div>
                    <div id="verdictText" style="font-size: 16px; font-weight: 600;"></div>
                </div>
                <div id="verdictSubtext" style="font-size: 12px; color: var(--text-muted); margin-bottom: 24px;"></div>
                <div style="font-size: 14px; color: #e5e7eb; margin-bottom: 16px;">
                    Did you enjoy this problem?
                </div>
                <div style="display: flex; gap: 12px; width: 100%;">
                    <button style="flex:1; padding: 8px; background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); border-radius: 6px; cursor: pointer; font-weight: 600;">Yes</button>
                    <button style="flex:1; padding: 8px; background: rgba(255,255,255,0.05); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; font-weight: 600;">No</button>
                </div>
            </div>
            
            <div id="statusMessage" class="status-banner"></div>
        </div>
    </main>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pid = urlParams.get('problem_id');
            
            if (pid) {
                try {
                    const res = await fetch(`http://localhost:8080/api/problems/${pid}`);
                    if (res.ok) {
                        const problem = await res.json();
                        document.getElementById('problemIdDisplay').textContent = `NCP-${problem.id}`;
                        document.getElementById('problemTitleDisplay').textContent = problem.title;
                        document.getElementById('problemDiffDisplay').textContent = problem.difficulty || 'Medium';
                        
                        const token = localStorage.getItem('jwt_token');
                        if (token) {
                            try {
                                const solvedRes = await fetch('http://localhost:8080/api/profile/solved', {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });
                                if (solvedRes.ok) {
                                    const solvedData = await solvedRes.json();
                                    if (solvedData.solved_problems && solvedData.solved_problems.includes(parseInt(pid))) {
                                        document.getElementById('problemSolvedDisplay').style.display = 'inline-flex';
                                    }
                                }
                            } catch(e){}
                        }
                        
                        let tagsHtml = '';
                        try {
                            const tags = JSON.parse(problem.tags);
                            if (tags.length > 0) {
                                tagsHtml = `<div style="margin-top: 8px; margin-bottom: 16px;">` + tags.map(t => `<span class="tag" style="margin-right:4px;">${t}</span>`).join('') + `</div>`;
                            }
                        } catch(e){}

                        let sampleHtml = '';
                        try {
                            const samples = JSON.parse(problem.sample_testcases);
                            if (samples.length > 0) {
                                window.currentProblemSamples = samples; // Store for app.js
                                samples.forEach((s, i) => {
                                    sampleHtml += `
                                    <div class="format-title">Sample Input ${i+1}</div>
                                    <div style="background:var(--card-bg); padding:10px; border:1px solid var(--card-border); border-radius:4px; font-family:monospace; margin-bottom:8px;">${s.input.replace(/\n/g, '<br>')}</div>
                                    <div class="format-title">Sample Output ${i+1}</div>
                                    <div style="background:var(--card-bg); padding:10px; border:1px solid var(--card-border); border-radius:4px; font-family:monospace; margin-bottom:16px;">${s.expected_output.replace(/\n/g, '<br>')}</div>
                                    `;
                                });
                            }
                        } catch(e) {}

                        document.getElementById('problemContentDisplay').innerHTML = `
                            ${tagsHtml}
                            <div style="margin-bottom: 24px;">${problem.description}</div>
                            
                            ${problem.input_format ? `<div class="format-title">Input Format</div><div style="margin-bottom:16px;">${problem.input_format}</div>` : ''}
                            ${problem.output_format ? `<div class="format-title">Output Format</div><div style="margin-bottom:16px;">${problem.output_format}</div>` : ''}
                            ${problem.constraints ? `<div class="format-title">Constraints</div><div style="margin-bottom:24px;">${problem.constraints}</div>` : ''}
                            
                            ${sampleHtml}
                        `;
                    } else {
                        document.getElementById('problemTitleDisplay').textContent = 'Problem not found';
                        document.getElementById('problemContentDisplay').innerHTML = '<p style="color:red;">Error loading problem.</p>';
                    }
                } catch(e) {
                    document.getElementById('problemTitleDisplay').textContent = 'Network Error';
                    document.getElementById('problemContentDisplay').innerHTML = '<p style="color:red;">Failed to connect to backend.</p>';
                }
            } else {
                document.getElementById('problemIdDisplay').textContent = '--';
                document.getElementById('problemTitleDisplay').textContent = 'No Problem Selected';
                document.getElementById('problemContentDisplay').innerHTML = '<p>Please select a problem from the Contests or Problems page.</p>';
            }

            // Tab logic
            document.querySelectorAll('.tc-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.tc-tab').forEach(t => {
                        t.classList.remove('active');
                        t.style.color = 'var(--text-muted)';
                        t.style.borderBottomColor = 'transparent';
                    });
                    const target = e.currentTarget;
                    target.classList.add('active');
                    target.style.color = '#10b981';
                    target.style.borderBottomColor = '#10b981';
                    
                    document.querySelectorAll('.tc-pane').forEach(p => p.style.display = 'none');
                    document.getElementById(target.dataset.target).style.display = 'flex';
                });
            });

            // Resizable panels logic
            const divider = document.getElementById('dragDivider');
            const leftPane = document.getElementById('arenaLeft');
            const rightPane = document.getElementById('arenaRight');
            let isDragging = false;

            divider.addEventListener('mousedown', (e) => {
                isDragging = true;
                divider.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                // Prevent text selection while dragging
                e.preventDefault(); 
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // Calculate percentage
                const containerWidth = document.querySelector('.niche-arena-layout').offsetWidth;
                const newLeftWidth = e.clientX; // Assuming layout touches left edge. Actually let's use bounding client rect
                const layoutRect = document.querySelector('.niche-arena-layout').getBoundingClientRect();
                let percentage = ((e.clientX - layoutRect.left) / containerWidth) * 100;
                
                // Boundaries
                if (percentage < 20) percentage = 20;
                if (percentage > 80) percentage = 80;
                
                leftPane.style.flex = `0 0 ${percentage}%`;
                rightPane.style.flex = `1 1 0%`;

                // If Monaco editor exists, tell it to resize
                if (window.monacoEditor) {
                    window.monacoEditor.layout();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    divider.classList.remove('dragging');
                    document.body.style.cursor = 'default';
                }
            });
        });
    </script>
<script src="js/components.js"></script>
</body>
</html>
