<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | User Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .module-card {
            background: rgba(20, 20, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 24px;
        }

        .profile-header h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .profile-header p {
            color: var(--text-muted);
            margin: 0 0 15px 0;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.verified {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .badge.unverified {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .stat-box label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .heatmap-container {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            gap: 2px;
            margin-top: 20px;
        }

        .heat-cell {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
        }
        .heat-cell[data-level="1"] { background: rgba(0, 240, 255, 0.3); }
        .heat-cell[data-level="2"] { background: rgba(0, 240, 255, 0.6); }
        .heat-cell[data-level="3"] { background: rgba(0, 240, 255, 1); }
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <!-- Unified Navigation -->
    <nav class="navbar">
        <a href="index.html" style="text-decoration: none; color: inherit;" class="nav-brand">
            <div>NicheCP</div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="contests.html" class="nav-link">Contests</a>
            <a href="index.html#problems" class="nav-link">Problems</a>
            <a href="arena.html" class="nav-link">Arena</a>
            <a href="index.html#resources" class="nav-link">Resources</a>
        </div>

        <div class="nav-controls">
            <button class="btn-ghost" onclick="logout()" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign Out</button>
        </div>
    </nav>

    <main class="app-container">
        <div class="campus-card">
            <h1 class="campus-title skeleton-box" id="userName" style="width: 200px; display: inline-block;"></h1>
            <p class="campus-subtitle skeleton-box" id="userEmail" style="width: 250px; display: inline-block; margin-bottom: 20px;"></p>
            
            <div style="margin-bottom: 30px;">
                <span class="skeleton-box" id="userBatch" style="width: 80px; display: inline-block; padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 4px; font-size: 12px;"></span>
                <span class="skeleton-box" id="userRollNo" style="width: 80px; display: inline-block; padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 4px; font-size: 12px; margin-left: 8px;"></span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                <div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Institution</div>
                    <div style="font-size: 15px; font-weight: 500;">Amrita Vishwa Vidyapeetham</div>
                </div>
                <div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Platform Rating</div>
                    <div style="font-size: 15px; font-weight: 500; color: #10b981;">Standard</div>
                </div>
                <div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Problems Solved</div>
                    <div class="skeleton-box" id="statSolved" style="width: 40px; font-size: 15px; font-weight: 500;"></div>
                </div>
            </div>

            <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                <div id="unverifiedBox">
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Link your amrita.edu email to participate in official campus contests.</p>
                    <div style="display: flex; gap: 8px; max-width: 400px;">
                        <input type="email" id="collegeEmailInput" placeholder="college_email@am.students.amrita.edu" style="flex: 1; padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px;">
                        <button class="btn-ghost" id="verifyBtn" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Verify</button>
                    </div>
                    <p id="verifyMsg" style="font-size: 12px; color: #ff4d4d; margin-top: 8px; display: none;"></p>
                </div>
                <div id="verifiedBox" style="display: none; display: flex; align-items: center; gap: 12px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#10b981" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="9 12 11 14 15 10"></polyline></svg>
                    <span id="verifiedEmailText" style="font-size: 14px; font-weight: 500;"></span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Redirect if not logged in
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Load Profile Data
            try {
                const res = await fetch('http://localhost:8080/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    const updateField = (id, value) => {
                        const el = document.getElementById(id);
                        if(el) {
                            el.textContent = value;
                            el.classList.remove('skeleton-box');
                            el.style.width = 'auto';
                            el.style.height = 'auto';
                        }
                    };

                    updateField('userName', data.name);
                    updateField('userEmail', data.email);
                    updateField('userRollNo', data.roll_no || 'No Roll No');
                    updateField('userBatch', data.batch || 'No Batch');
                    
                    const solvedEl = document.getElementById('statSolved');
                    if (solvedEl) solvedEl.textContent = data.total_solved || 0;

                    if (data.is_college_verified) {
                        document.getElementById('unverifiedBox').style.display = 'none';
                        document.getElementById('verifiedBox').style.display = 'flex';
                    }
                }
            } catch (e) {
                console.error("Failed to load profile:", e);
            }

            // Verify Email Logic
            document.getElementById('verifyBtn').addEventListener('click', async () => {
                const email = document.getElementById('collegeEmailInput').value;
                const msg = document.getElementById('verifyMsg');
                if (!email) {
                    msg.textContent = 'Please enter an email';
                    msg.style.display = 'block';
                    return;
                }

                try {
                    document.getElementById('verifyBtn').textContent = 'Sending...';
                    const res = await fetch('http://localhost:8080/api/profile/verify-college-email', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        msg.style.color = '#10b981';
                        msg.textContent = 'OTP Sent! Check your Outlook mail.';
                        msg.style.display = 'block';
                        document.getElementById('verifyBtn').textContent = 'Send again';
                    } else {
                        msg.style.color = '#ff4d4d';
                        msg.textContent = data.error;
                        msg.style.display = 'block';
                        document.getElementById('verifyBtn').textContent = 'Verify';
                    }
                } catch(err) {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = 'Failed to connect';
                    msg.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
