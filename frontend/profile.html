<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheCP | User Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .module-card {
            background: rgba(20, 20, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 24px;
        }

        .profile-header h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .profile-header p {
            color: var(--text-muted);
            margin: 0 0 15px 0;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.verified {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .badge.unverified {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .stat-box label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        .heatmap-container {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            gap: 2px;
            margin-top: 20px;
        }

        .heat-cell {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
        }
        .heat-cell[data-level="1"] { background: rgba(0, 240, 255, 0.3); }
        .heat-cell[data-level="2"] { background: rgba(0, 240, 255, 0.6); }
        .heat-cell[data-level="3"] { background: rgba(0, 240, 255, 1); }
    </style>
</head>
<body data-theme="quantum">
    <div class="noise-bg" style="opacity: 0.4;"></div>

    <nav class="navbar" style="padding: 12px 40px; border-bottom: 1px solid rgba(255,255,255,0.05); background: var(--bg-base);">
        <a href="index.html" style="text-decoration: none; color: inherit;">
            <div class="nav-brand" style="font-size: 20px; font-weight: 700; letter-spacing: -0.5px;">NicheCP</div>
        </a>
        <div style="display: flex; gap: 8px; align-items: center;">
            <a href="index.html" class="nav-link">Home</a>
            <a href="arena.html" class="nav-link">Arena</a>
        </div>
        <div class="nav-controls">
            <button class="btn-ghost" onclick="logout()" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;">Sign Out</button>
        </div>
    </nav>

    <div class="profile-container">
        <!-- Left Sidebar: Identity -->
        <div class="module-card profile-header">
            <h2 id="userName">Loading...</h2>
            <p id="userEmail">Loading...</p>
            
            <div style="margin-bottom: 10px;">
                <span class="badge" style="background: rgba(255,255,255,0.1); color: white;" id="userRollNo">Roll No</span>
                <span class="badge" style="background: rgba(255,255,255,0.1); color: white;" id="userBatch">Batch</span>
            </div>

            <div id="verifyStatus" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <h3 style="font-size: 14px; margin-bottom: 10px;">College Integration</h3>
                <div id="unverifiedBox">
                    <span class="badge unverified">Unverified</span>
                    <p style="font-size: 12px; color: var(--text-muted); margin: 10px 0;">Connect your Outlook email for official contests.</p>
                    <input type="email" id="collegeEmailInput" placeholder="college_email@am.students.amrita.edu" style="width: 100%; padding: 8px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; margin-bottom: 10px;">
                    <button class="btn-magnetic" id="verifyBtn" style="width: 100%; padding: 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer;">Send OTP to Outlook</button>
                    <p id="verifyMsg" style="font-size: 11px; color: #ff4d4d; margin-top: 5px; display: none;"></p>
                </div>
                <div id="verifiedBox" style="display: none;">
                    <span class="badge verified">Verified ✓</span>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;" id="verifiedEmailText"></p>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <span id="statContests">4</span>
                    <label>Contests</label>
                </div>
                <div class="stat-box">
                    <span id="statSolved">15</span>
                    <label>Solved</label>
                </div>
            </div>
        </div>

        <!-- Right Content: Analytics -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="module-card">
                <h3 style="font-size: 16px; margin-bottom: 10px;">Solving Activity</h3>
                <p style="font-size: 12px; color: var(--text-muted);">Your submission density over the last year.</p>
                
                <div class="heatmap-container" id="heatmap">
                    <!-- Mock generated by JS -->
                </div>
            </div>

            <div class="module-card">
                <h3 style="font-size: 16px; margin-bottom: 10px;">Topic Proficiency (Radar)</h3>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Based on your 15 solved problems.</p>
                
                <div class="chart-container">
                    <canvas id="topicRadarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Redirect if not logged in
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Load Profile Data
            try {
                const res = await fetch('http://localhost:8080/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('userName').textContent = data.name;
                    document.getElementById('userEmail').textContent = data.email;
                    document.getElementById('userRollNo').textContent = data.roll_no || 'No Roll No';
                    document.getElementById('userBatch').textContent = data.batch || 'No Batch';
                    document.getElementById('statSolved').textContent = data.total_solved || 0;

                    if (data.is_college_verified) {
                        document.getElementById('unverifiedBox').style.display = 'none';
                        document.getElementById('verifiedBox').style.display = 'block';
                        document.getElementById('verifiedEmailText').textContent = data.college_email;
                    }
                }
            } catch (e) {
                console.error("Failed to load profile:", e);
            }

            // Verify Email Logic
            document.getElementById('verifyBtn').addEventListener('click', async () => {
                const email = document.getElementById('collegeEmailInput').value;
                const msg = document.getElementById('verifyMsg');
                if (!email) {
                    msg.textContent = 'Please enter an email';
                    msg.style.display = 'block';
                    return;
                }

                try {
                    document.getElementById('verifyBtn').textContent = 'Sending...';
                    const res = await fetch('http://localhost:8080/api/profile/verify-college-email', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        msg.style.color = '#00ffcc';
                        msg.textContent = 'OTP Sent! Check your Outlook mail. (OTP UI verification not fully built yet, see terminal logs to simulate)';
                        msg.style.display = 'block';
                        document.getElementById('verifyBtn').textContent = 'Send again';
                    } else {
                        msg.style.color = '#ff4d4d';
                        msg.textContent = data.error;
                        msg.style.display = 'block';
                        document.getElementById('verifyBtn').textContent = 'Send OTP to Outlook';
                    }
                } catch(err) {
                    msg.style.color = '#ff4d4d';
                    msg.textContent = 'Failed to connect';
                    msg.style.display = 'block';
                }
            });

            // Mock Heatmap Generation (52 weeks * 7 days roughly)
            const heatmap = document.getElementById('heatmap');
            for (let i = 0; i < 364; i++) {
                const cell = document.createElement('div');
                cell.className = 'heat-cell';
                
                // Randomly assign levels to make it look active recently
                if (i > 300) {
                    if (Math.random() > 0.6) cell.setAttribute('data-level', Math.floor(Math.random() * 3) + 1);
                } else {
                    if (Math.random() > 0.95) cell.setAttribute('data-level', '1');
                }
                
                heatmap.appendChild(cell);
            }

            // Render Radar Chart using Chart.js
            const ctx = document.getElementById('topicRadarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Dynamic Programming', 'Graph Theory', 'Data Structures', 'Math', 'Strings', 'Greedy'],
                    datasets: [{
                        label: 'Proficiency Score',
                        data: [65, 80, 90, 70, 50, 85],
                        backgroundColor: 'rgba(0, 240, 255, 0.2)',
                        borderColor: 'rgba(0, 240, 255, 1)',
                        pointBackgroundColor: 'rgba(0, 240, 255, 1)',
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: {
                                color: 'rgba(255, 255, 255, 0.7)',
                                font: { size: 12, family: "'Outfit', sans-serif" }
                            },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        });
    </script>
</body>
</html>
