<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ICPC Amrita Nagercoil</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--text-primary);
            overflow: hidden;
        }

        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .split-left {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .split-right {
            flex: 1;
            display: none;
            position: relative;
            background: radial-gradient(circle at center, rgba(59,130,246,0.05) 0%, var(--bg-color) 100%);
            border-left: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        @media (min-width: 900px) {
            .split-right {
                display: flex;
            }
        }

        /* Ambient Grid for Right Pane */
        .ambient-grid {
            position: absolute;
            inset: -100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(45deg);
            animation: gridMove 20s linear infinite;
            mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
        }

        .login-container {
            width: 100%;
            max-width: 380px;
        }

        .login-title {
            font-family: var(--font-display);
            font-size: 36px;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .login-subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 15px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background-color: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .google-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ff4081;
        }

        .auth-link {
            color: #ff4081;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
            display: block;
        }
        .auth-link:hover { text-decoration: underline; }

        .error-msg {
            color: #ff3232;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .success-msg {
            color: #00ffcc;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
    <div class="split-layout">
        <!-- Left: Form -->
        <div class="split-left">
            <div class="login-container">
                <!-- Simple Logo/Brand -->
                <a href="index.html" style="display: inline-block; color: white; text-decoration: none; font-weight: 700; font-size: 20px; letter-spacing: -0.5px; margin-bottom: 40px;">
                    <span style="color: var(--primary-accent);">Niche</span>CP
                </a>
        <h1 class="login-title">Join the Arena</h1>
        <p class="login-subtitle">Create your account to start competing</p>

        <div id="errorBox" class="error-msg"></div>
        <div id="successBox" class="success-msg"></div>

        <form id="registerForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" id="rollNo" required placeholder="e.g., CB.EN.U4CYS22000">
            </div>
            <div class="input-group">
                <label>Batch</label>
                <input type="text" id="batch" required placeholder="e.g., 2022-2026">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div id="otpSection" style="display: none;">
                <div class="input-group">
                    <label>6-Digit OTP</label>
                    <input type="text" id="otpCode" placeholder="Enter OTP sent to email" maxlength="6">
                </div>
            </div>
            <button type="submit" id="mainSubmitBtn" class="google-btn" style="background: linear-gradient(90deg, #b388ff 0%, #ff4081 100%); color: white; margin-top: 10px;">
                Send OTP & Continue
            </button>
        </form>

        <a href="login.html" class="auth-link">Already have an account? Sign In</a>
            </div>
        </div>

        <!-- Right: Visual -->
        <div class="split-right">
            <div class="ambient-grid"></div>
            <!-- Floating Elements / Orbs could go here -->
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; height: 400px; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); border-radius: 50%; filter: blur(40px);"></div>
        </div>
    </div>

    <script>
        let otpSent = false;

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const rollNo = document.getElementById('rollNo').value;
            const batch = document.getElementById('batch').value;
            const password = document.getElementById('password').value;
            const otpCode = document.getElementById('otpCode').value;
            
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            const mainBtn = document.getElementById('mainSubmitBtn');
            const otpSec = document.getElementById('otpSection');

            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            
            try {
                if (!otpSent) {
                    // 1. Send OTP Request
                    mainBtn.textContent = 'Sending...';
                    mainBtn.disabled = true;

                    const res = await fetch('http://localhost:8080/api/auth/register-otp/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        otpSent = true;
                        otpSec.style.display = 'block';
                        document.getElementById('otpCode').setAttribute('required', 'true');
                        mainBtn.textContent = 'Verify & Create Account';
                        successBox.textContent = data.message;
                        successBox.style.display = 'block';
                    } else {
                        throw new Error(data.error);
                    }
                } else {
                    // 2. Verify OTP & Register
                    mainBtn.textContent = 'Verifying...';
                    mainBtn.disabled = true;

                    const res = await fetch('http://localhost:8080/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, roll_no: rollNo, batch, otp: otpCode })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        successBox.textContent = data.message + ' Redirecting to login...';
                        successBox.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        throw new Error(data.error);
                    }
                }
            } catch (err) {
                errorBox.textContent = err.message || 'Server connection failed.';
                errorBox.style.display = 'block';
            } finally {
                if (mainBtn.textContent !== 'Verify & Create Account' && !otpSent) {
                     mainBtn.textContent = 'Send OTP & Continue';
                }
                mainBtn.disabled = false;
            }
        });
    </script>
<script src="js/components.js"></script>
</body>
</html>
