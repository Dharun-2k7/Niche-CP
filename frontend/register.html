<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NicheCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #060606;
            font-family: 'Inter', sans-serif;
            color: #FAFAFA;
            overflow: hidden;
            display: flex;
        }

        /* Split Screen Layout */
        .split-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Side: Visuals & Branding */
        .split-brand {
            flex: 1;
            display: none;
            position: relative;
            background: #060606;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        @media (min-width: 900px) {
            .split-brand {
                display: flex;
            }
        }

        /* Subtle Animated Background for Brand Side */
        .brand-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            animation: pulseBg 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .brand-content {
            position: relative;
            z-index: 1;
            padding: 40px;
            max-width: 480px;
        }

        /* Right Side: Form */
        .split-form {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #060606;
            position: relative;
            overflow-y: auto;
        }

        /* Glassmorphic Form Container */
        .form-container {
            width: 100%;
            max-width: 420px;
            background: #101010;
            padding: 48px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            margin: auto;
        }

        .auth-header {
            margin-bottom: 32px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #A3A3A3;
        }

        /* Modern Floating Label Inputs */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #A3A3A3;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus,
        .input-group input:not(:placeholder-shown) {
            border-color: #3B82F6;
            background: rgba(255, 255, 255, 0.05);
            padding-top: 24px;
            padding-bottom: 8px;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 12px;
            font-size: 11px;
            color: #3B82F6;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #FAFAFA;
            color: #060606;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #E5E5E5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .auth-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
            color: #A3A3A3;
        }

        .auth-footer a {
            color: #FAFAFA;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: #3B82F6;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
        }
        
        .success-msg {
            background: rgba(52, 211, 153, 0.1);
            color: #34D399;
            border: 1px solid rgba(52, 211, 153, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="global-nav-container" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 1000;"></div>
    <div class="split-layout">
        <!-- Left: Visual & Branding -->
        <div class="split-brand">
            <div class="brand-bg"></div>
            <div class="brand-content">
                <a href="index.html" style="text-decoration: none; display: inline-block; margin-bottom: 32px;">
                    <h1 style="font-size: 32px; font-weight: 700; color: #FAFAFA; letter-spacing: -1px;">
                        <span style="color: #3B82F6;">Niche</span>CP
                    </h1>
                </a>
                <h2 style="font-size: 24px; font-weight: 600; margin-bottom: 16px; line-height: 1.3;">Join the arena.</h2>
                <p style="color: #A3A3A3; font-size: 16px; line-height: 1.6;">Create your account to start competing and tracking your algorithmic engineering progress.</p>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="split-form">
            <div class="form-container">
                <div class="auth-header">
                    <h1 class="auth-title">Create account</h1>
                    <p class="auth-subtitle">Fill in the details below to get started</p>
                </div>

                <div id="errorBox" class="error-msg"></div>
                <div id="successBox" class="success-msg"></div>

                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" id="name" placeholder=" " required>
                        <label for="name">Full Name</label>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" placeholder=" " required>
                        <label for="email">Email address</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder=" " required minlength="6">
                        <label for="password">Password</label>
                    </div>

                    <div id="otpSection" class="input-group" style="display: none;">
                        <input type="text" id="otpCode" placeholder=" " maxlength="6">
                        <label for="otpCode">6-Digit OTP</label>
                    </div>

                    <button type="submit" id="mainSubmitBtn" class="btn-primary">Send OTP & Continue</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let otpSent = false;

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const otpCode = document.getElementById('otpCode').value;
            
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            const mainBtn = document.getElementById('mainSubmitBtn');
            const otpSec = document.getElementById('otpSection');

            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            
            try {
                if (!otpSent) {
                    // 1. Send OTP Request
                    mainBtn.textContent = 'Sending...';
                    mainBtn.disabled = true;

                    const res = await fetch('/api/auth/register-otp/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        otpSent = true;
                        otpSec.style.display = 'block';
                        
                        // Disable fields
                        document.getElementById('name').disabled = true;
                        document.getElementById('email').disabled = true;
                        document.getElementById('password').disabled = true;
                        
                        document.getElementById('otpCode').required = true;
                        
                        mainBtn.textContent = 'Verify OTP & Register';
                        mainBtn.disabled = false;
                        
                        successBox.textContent = data.message || 'OTP sent successfully. Check your email.';
                        successBox.style.display = 'block';
                    } else {
                        throw new Error(data.error || 'Failed to send OTP');
                    }
                } else {
                    // 2. Verify OTP & Create User
                    mainBtn.textContent = 'Verifying...';
                    mainBtn.disabled = true;

                    const res = await fetch('/api/auth/register-otp/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password, otp: otpCode })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        localStorage.setItem('jwt_token', data.token);
                        successBox.textContent = 'Registration successful! Redirecting...';
                        successBox.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        throw new Error(data.error || 'Invalid OTP');
                    }
                }
            } catch (err) {
                mainBtn.textContent = otpSent ? 'Verify OTP & Register' : 'Send OTP & Continue';
                mainBtn.disabled = false;
                errorBox.textContent = err.message || 'Server connection failed.';
                errorBox.style.display = 'block';
            }
        });
    </script>
<script src="js/app.js"></script>
<script src="js/components.js"></script>
</body>
</html>
