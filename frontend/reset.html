<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ICPC Amrita Nagercoil</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d12;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 100%;
        }

        .login-title {
            color: white;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ff4081;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background-color: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .auth-link {
            color: #ff4081;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
            display: block;
        }
        .auth-link:hover { text-decoration: underline; }

        .success-msg {
            color: #00ffcc;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="login-title" id="title">Reset Password</h1>
        <p class="login-subtitle" id="subtitle">We'll send you an email to reset it.</p>

        <div id="successBox" class="success-msg"></div>

        <form id="resetForm">
            <div id="emailSection">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
            </div>

            <div id="passwordSection" style="display: none;">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="google-btn" style="background: linear-gradient(90deg, #b388ff 0%, #ff4081 100%); color: white;">
                Send Reset Link
            </button>
        </form>

        <a href="login.html" class="auth-link">Back to Sign In</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const btn = document.getElementById('submitBtn');
        const emailSection = document.getElementById('emailSection');
        const passwordSection = document.getElementById('passwordSection');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('newPassword');

        if (token) {
            title.textContent = 'Set New Password';
            subtitle.textContent = 'Enter your new secure password below.';
            emailSection.style.display = 'none';
            emailInput.removeAttribute('required');
            passwordSection.style.display = 'block';
            passInput.setAttribute('required', 'true');
            btn.textContent = 'Update Password';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const successBox = document.getElementById('successBox');
            successBox.style.color = '#ff3232'; // Default to error color
            successBox.style.display = 'none';
            
            try {
                if (token) {
                    // Reset Password Flow
                    const new_password = passInput.value;
                    const res = await fetch('http://localhost:8080/api/auth/password/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, new_password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        successBox.style.color = '#00ffcc';
                        successBox.textContent = data.message;
                        setTimeout(() => window.location.href = 'login.html', 2000);
                    } else throw new Error(data.error);
                } else {
                    // Forgot Password Flow
                    const email = emailInput.value;
                    const res = await fetch('http://localhost:8080/api/auth/password/forgot', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        successBox.style.color = '#00ffcc';
                        successBox.textContent = data.message;
                        emailInput.value = '';
                    } else throw new Error(data.error);
                }
            } catch (err) {
                successBox.style.color = '#ff3232';
                successBox.textContent = err.message || 'Server connection failed.';
            }
            successBox.style.display = 'block';
        });
    </script>
</body>
</html>
